SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Tenants = {"t1"}
  Providers = {"p1"}
  MaxConcurrent = 1
  MaxReq = 2
  MaxRequeue = 1
  MaxQueueLen = 2
  AllowStreaming = TRUE
  AllowCrossProvider = FALSE
  AllowMultiTenant = FALSE
  AllowGracefulShutdown = FALSE
  AllowHeartbeats = FALSE
  AllowAuthFailure = FALSE
  AllowBackendError = TRUE
  AllowStrayFrames = TRUE
  AckCancelOrReap = TRUE
  NoRequeueAfterChunk = TRUE
  VerifyOwnerBeforeComplete = TRUE
  IsolateBackendErrors = TRUE
  AtomicLoadBeforeComplete = TRUE
  DrainOnRegisterAndDisconnect = TRUE
  RequeueUnderRequestProvider = TRUE
  EnforceTenantIsolation = TRUE
  EnforceRoutingOnQueuedDispatch = TRUE
  HeartbeatIndependentOfWsPing = TRUE
  StopAssigningWhileDraining = TRUE
  RequireRegisterAckBeforeConnected = TRUE
  UnaryNon2xxForStreamingError = TRUE

INVARIANTS
  CapacityRespected
  NoOrphanedServerSlot
  SingleStreamOrigin
  OwnerMatchesDelivery
  ErrorIsolation
  LoadAccountingAccurate
  WorkConserving
  QueueProviderConsistent
  TenantIsolated
  RoutingRespected
  WedgedWorkerDetected
  NoDispatchWhileDraining
  ConnectedMeansRegistered
  ErrorStatusPreserved
